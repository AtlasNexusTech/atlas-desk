<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexDesk — Remote Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;height:100vh}
#toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center;background:rgba(20,20,35,0.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:40px;padding:6px 16px}
#toolbar input,#toolbar button{padding:8px 14px;border-radius:20px;border:none;font-size:13px;outline:none}
#toolbar input{background:rgba(255,255,255,0.06);color:#fff;width:140px;text-align:center}
#toolbar button{background:#2563EB;color:#fff;cursor:pointer;font-weight:600}
#toolbar button:hover{background:#1d4ed8}
#toolbar button.disconnect{background:#dc2626}
#status{font-size:12px;color:#94a3b8;margin-left:4px}
#screen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
#screen img{max-width:100%;max-height:100%;object-fit:contain}
#screen canvas{display:none}
.connecting{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);z-index:5}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#2563EB;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="toolbar">
  <span style="font-weight:700;font-size:14px">⬡ NexDesk</span>
  <input id="agentId" placeholder="Agent ID" value="">
  <button id="connectBtn" onclick="connect()">Connect</button>
  <button class="disconnect" id="disconnectBtn" onclick="disconnect()" style="display:none">Disconnect</button>
  <span id="status">Idle</span>
</div>

<div id="screen">
  <img id="frame" alt="Remote screen">
</div>

<div id="connectingOverlay" class="connecting" style="display:none">
  <div style="text-align:center">
    <div class="spinner"></div>
    <p style="margin-top:16px;color:#94a3b8;font-size:14px">Connecting...</p>
  </div>
</div>

<script>
let ws, connected = false;
const SIGNAL = 'ws://localhost:8800/ws';

function setStatus(s) { document.getElementById('status').textContent = s; }
function showOverlay(s) {
  const el = document.getElementById('connectingOverlay');
  el.style.display = s ? 'flex' : 'none';
}

async function connect() {
  const agentId = document.getElementById('agentId').value.trim();
  if (!agentId) return alert('Enter Agent ID');

  showOverlay(true);
  setStatus('Connecting...');

  ws = new WebSocket(SIGNAL);
  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'register',
      payload: { id: 'viewer-' + Date.now(), role: 'client' },
      target: agentId
    }));
    setStatus('Registered');
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'frame':
        const frame = JSON.parse(msg.payload);
        const img = document.getElementById('frame');
        const blob = new Blob([new Uint8Array(frame.data)], {type:'image/png'});
        img.src = URL.createObjectURL(blob);
        showOverlay(false);
        setStatus('Streaming');
        break;
      case 'pong':
        break;
    }
  };

  ws.onclose = () => {
    setStatus('Disconnected');
    showOverlay(false);
    document.getElementById('connectBtn').style.display = '';
    document.getElementById('disconnectBtn').style.display = 'none';
  };

  ws.onerror = () => setStatus('Error');

  document.getElementById('connectBtn').style.display = 'none';
  document.getElementById('disconnectBtn').style.display = '';
}

function disconnect() {
  if (ws) ws.close();
  ws = null;
}

// Mouse & keyboard forwarding
document.getElementById('screen').addEventListener('mousemove', (e) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const img = document.getElementById('frame');
  const rect = img.getBoundingClientRect();
  const scaleX = img.naturalWidth / rect.width;
  const scaleY = img.naturalHeight / rect.height;
  const x = Math.round((e.clientX - rect.left) * scaleX);
  const y = Math.round((e.clientY - rect.top) * scaleY);
  ws.send(JSON.stringify({
    type: 'input',
    target: document.getElementById('agentId').value.trim(),
    payload: JSON.stringify({ action: 'mouse_move', x, y })
  }));
});

document.getElementById('screen').addEventListener('click', (e) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: 'input',
    target: document.getElementById('agentId').value.trim(),
    payload: JSON.stringify({ action: 'mouse_click', button: 'left' })
  }));
});

document.addEventListener('keydown', (e) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (e.target.tagName === 'INPUT') return;
  ws.send(JSON.stringify({
    type: 'input',
    target: document.getElementById('agentId').value.trim(),
    payload: JSON.stringify({ action: 'key', key: e.key })
  }));
});
</script>
</body>
</html>
